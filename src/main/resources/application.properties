spring.application.name=food-ordering-system

# H2 in-memory database (zero setup - great for CI/CD pipelines)
spring.datasource.url=jdbc:h2:mem:fooddb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Load sample data on startup
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# H2 console (handy for debugging, disable in real production)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.port=8080
